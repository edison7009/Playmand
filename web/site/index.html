<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playmand · A card pack built in Rust</title>
<meta name="description" content="A tearable foil card pack and five holographic cards, written in Rust and compiled to WebAssembly with WebGL2. 66 KB of code. Made with the Playmand skill.">
<link rel="canonical" href="https://playmand.com/">
<link rel="alternate" hreflang="en" href="https://playmand.com/">
<link rel="alternate" hreflang="zh-CN" href="https://playmand.com/zh/">
<link rel="alternate" hreflang="x-default" href="https://playmand.com/">
<meta property="og:title" content="Playmand · A card pack built in Rust">
<meta property="og:description" content="Tear a foil pack and five holographic cards turn face up. Built in Rust and WebAssembly, 66 KB of code.">
<meta property="og:image" content="https://playmand.com/art/og.webp">
<link rel="icon" href="art/logo.svg" type="image/svg+xml">
<!-- Fetch the code and the pack's art while the page is still parsing. -->
<link rel="modulepreload" href="pkg/playmand.js">
<link rel="preload" href="pkg/playmand_bg.wasm" as="fetch" type="application/wasm" crossorigin>
<link rel="preload" href="art/echo-body.webp" as="image">
<link rel="preload" href="art/echo-eyes.webp" as="image">
<style>
  :root { --ink: #24221f; --soft: #77716a; --line: #d9d4cb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 32%, #f8f6f2 0%, #ebe8e2 70%, #dfdbd4 100%); }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 16px 20px; pointer-events: none; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 16px; }
  header .gh { pointer-events: auto; font-size: 13px; color: inherit; text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgb(255 255 255 / .7); }
  /* Language menu, after EchoBird's site: a globe button with a short list. */
  .lang { pointer-events: auto; position: relative; margin-left: auto; }
  .lang summary { list-style: none; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgb(255 255 255 / .7); }
  .lang summary::-webkit-details-marker { display: none; }
  .lang .opts { position: absolute; right: 0; top: calc(100% + 8px); display: grid; gap: 2px; min-width: 150px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 10px 28px rgb(0 0 0 / .12); }
  .lang .opts a { padding: 8px 12px; border-radius: 8px; color: inherit; text-decoration: none; font-size: 13px; }
  .lang .opts a:hover, .lang .opts a[aria-current] { background: #f1eee8; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; opacity: 0; transition: opacity .5s ease; }
  canvas.on { opacity: 1; }

  /* Loading: a dark pack silhouette with a sheen running across it. */
  .loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; transition: opacity .4s ease; pointer-events: none; }
  .loading.done { opacity: 0; }
  .loading div { display: grid; justify-items: center; gap: 18px; }
  .pack { width: 132px; height: 190px; border-radius: 10px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #2a2a30, #0d0d11); box-shadow: 0 26px 40px -18px rgb(20 16 40 / .55);
    animation: bob 1.6s ease-in-out infinite; }
  .pack::before, .pack::after { content: ""; position: absolute; left: 0; right: 0; height: 13px;
    background: repeating-linear-gradient(90deg, #3a3a42 0 6px, #1b1b20 6px 12px); }
  .pack::before { top: 0; } .pack::after { bottom: 0; }
  .pack i { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .22) 50%, transparent 65%); transform: translateX(-100%); animation: sheen 1.3s ease-in-out infinite; }
  .loading span { font-size: 13px; color: var(--soft); letter-spacing: .02em; }
  @keyframes sheen { to { transform: translateX(100%); } }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-1deg); } }

  .foot { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 3; display: grid; justify-items: center; gap: 8px; padding: 0 16px; text-align: center; pointer-events: none; }
  .hint { font-size: 13px; color: var(--soft); display: flex; gap: 12px; align-items: center; }
  .hint button { pointer-events: auto; font: inherit; font-size: 13px; padding: 6px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .claim { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .claim small { font-weight: 400; color: var(--soft); }
  @media (prefers-reduced-motion: reduce) { .pack, .pack i { animation: none; } }
</style>
</head>
<body>
<header><img src="art/logo.svg" alt=""><b>Playmand</b>
  <details class="lang"><summary aria-label="Language / 语言"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></svg><span id="langLabel">EN</span></summary>
    <div class="opts"><a href="./" lang="en" hreflang="en" aria-current="true">English</a><a href="zh/" lang="zh-CN" hreflang="zh-CN">简体中文</a></div></details>
  <a class="gh" href="https://github.com/edison7009/Playmand">GitHub</a></header>
<div class="loading" id="loading"><div><div class="pack"><i></i></div><span data-t="loading">Loading…</span></div></div>
<canvas id="cards" tabindex="0" aria-label="Card pack"></canvas>
<div class="foot">
  <div class="hint"><span id="hint" data-t="tear">Drag across the top of the pack to tear it, or click it.</span><button id="again" hidden data-t="again">Open another pack</button></div>
  <div class="claim" data-t="claim">Card pack built in Rust · only 66 KB of code <small>(WebAssembly + JS, gzipped)</small></div>
</div>

<script type="module">
import init, { SupplyScene } from './pkg/playmand.js';

// The page's language is set in its HTML: / is English, /zh/ is Chinese
// (generated from this file by web/make_pages.py).
const zh = document.documentElement.lang.startsWith('zh');
const T = zh ? {
  tear: '按住包装顶部横向拖动撕开，或直接点一下。',
  ready: '把鼠标移到卡片上，看光影和倾斜。',
} : {
  tear: 'Drag across the top of the pack to tear it, or click it.',
  ready: 'Move the pointer over a card to see it tilt and catch the light.',
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const load = (src) => new Promise((ok, bad) => { const img = new Image(); img.onload = () => ok(img); img.onerror = bad; img.src = src; });
const LAYERS = ['body', 'eyes', 'joy', 'wince', 'smile', 'open'];
const CHARS = ['echo', 'sprout', 'twin', 'zip', 'puff'];

await init();
const canvas = document.getElementById('cards');
const scene = new SupplyScene(canvas);
const addLayers = (ci) => Promise.all(LAYERS.map(async (l, li) => {
  if (ci === 0 && li >= 4) return; // Echo's beak is its mouth
  try { scene.add_art(ci, li, await load(`art/${CHARS[ci]}-${l}.webp`)); } catch { /* drawn without this layer */ }
}));

// First paint needs only the pack: its mascot (Echo), the logo and the words.
const [, logo] = await Promise.all([addLayers(0), load('art/logo.svg')]);
scene.set_logo(logo);
scene.set_copy('Playmand', 'CARD PACK', zh ? '沿此撕开 →' : 'TEAR HERE →', zh ? '卡包' : 'Card pack', zh ? '五张卡' : '5 cards');
scene.set_reduced_motion(reduced);
const fit = () => scene.resize(innerWidth, innerHeight, devicePixelRatio || 1);
fit(); addEventListener('resize', fit);

// The card fronts and their characters follow in the background; they are
// only needed once the cards have been dealt.
const CARDS = zh ? [
  [0, 2, 'Zip', '×1.5', '冷却更快', 'DASH'],
  [1, 0, 'Sprout', '+40', '每次都在长大', 'GROW'],
  [2, 1, 'Twin', '×2', '双倍奖励 · 15 分钟', 'DOUBLE'],
  [3, 4, 'Puff', '+3', '轻得像一朵云', 'FLOAT'],
  [4, 3, 'Echo', '+1', '包里的老朋友', 'CHIRP'],
] : [
  [0, 2, 'Zip', '×1.5', 'Faster cooldowns', 'DASH'],
  [1, 0, 'Sprout', '+40', 'Grows with every task', 'GROW'],
  [2, 1, 'Twin', '×2', 'Double rewards · 15 min', 'DOUBLE'],
  [3, 4, 'Puff', '+3', 'Light as a cloud', 'FLOAT'],
  [4, 3, 'Echo', '+1', 'An old friend in the pack', 'CHIRP'],
];
const cardsReady = Promise.all([1, 2, 3, 4].map(addLayers)).then(() => {
  for (const c of CARDS) scene.set_showcase_card(...c);
});

const point = (e) => [e.clientX, e.clientY];
canvas.addEventListener('pointermove', (e) => scene.pointer_move(...point(e)));
canvas.addEventListener('pointerdown', (e) => { if (scene.pointer_down(...point(e))) canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => { if (scene.pointer_up(...point(e)) === 1) scene.open(); });
canvas.addEventListener('pointerleave', () => scene.leave());
canvas.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scene.open(); } });
const hint = document.getElementById('hint'), again = document.getElementById('again');
again.onclick = () => { scene.reset(Math.floor(Math.random() * 1e9)); again.hidden = true; hint.textContent = T.tear; canvas.focus(); };

// One animation loop, paused while the tab is hidden.
let raf = 0, shown = false;
function loop(t) {
  raf = 0;
  if (document.hidden) return;
  const ev = scene.frame(t);
  if (!shown) {
    shown = true;
    canvas.classList.add('on');
    document.getElementById('loading').classList.add('done');
  }
  if (ev & 4) {
    cardsReady.then(() => setTimeout(() => scene.showcase(), reduced ? 0 : 350));
    hint.textContent = T.ready;
    again.hidden = false;
  }
  raf = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) raf = requestAnimationFrame(loop); });
loop(performance.now()); // draw the first frame now, then follow the display
canvas.focus({ preventScroll: true });

// For poking at it from the browser console.
window.playmand = { scene };
</script>
</body>
</html>
