<script type="module">
import init, { SupplyScene } from './pkg/playmand.js';

// The page's language is set in its HTML: / is English, /zh/ is Chinese
// (generated from this file by web/make_pages.py).
const zh = document.documentElement.lang.startsWith('zh');
const T = zh ? {
  tear: '按住包装顶部横向拖动撕开，或直接点一下。',
  ready: '把鼠标移到卡片上，看光影和倾斜。',
} : {
  tear: 'Drag across the top of the pack to tear it, or click it.',
  ready: 'Move the pointer over a card to see it tilt and catch the light.',
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const load = (src) => new Promise((ok, bad) => { const img = new Image(); img.onload = () => ok(img); img.onerror = bad; img.src = src; });
const LAYERS = ['body', 'eyes', 'joy', 'wince', 'smile', 'open'];
const CHARS = ['echo', 'sprout', 'twin', 'zip', 'puff'];

await init();
const canvas = document.getElementById('cards');
const scene = new SupplyScene(canvas);
const addLayers = (ci) => Promise.all(LAYERS.map(async (l, li) => {
  if (ci === 0 && li >= 4) return; // Echo's beak is its mouth
  try { scene.add_art(ci, li, await load(`art/${CHARS[ci]}-${l}.webp`)); } catch { /* drawn without this layer */ }
}));

// First paint needs only the pack: its mascot (Echo), the logo and the words.
const [, logo] = await Promise.all([addLayers(0), load('art/logo.svg')]);
scene.set_logo(logo);
scene.set_copy('Playmand', 'CARD PACK', zh ? '沿此撕开 →' : 'TEAR HERE →', zh ? '卡包' : 'Card pack', zh ? '五张卡' : '5 cards');
scene.set_reduced_motion(reduced);
const fit = () => scene.resize(canvas.clientWidth, canvas.clientHeight, devicePixelRatio || 1);
fit(); addEventListener('resize', fit);

// The card fronts and their characters follow in the background; they are
// only needed once the cards have been dealt.
const CARDS = zh ? [
  [0, 2, 'Zip', '×1.5', '冷却更快', 'DASH'],
  [1, 0, 'Sprout', '+40', '每次都在长大', 'GROW'],
  [2, 1, 'Twin', '×2', '双倍奖励 · 15 分钟', 'DOUBLE'],
  [3, 4, 'Puff', '+3', '轻得像一朵云', 'FLOAT'],
  [4, 3, 'Echo', '+1', '包里的老朋友', 'CHIRP'],
] : [
  [0, 2, 'Zip', '×1.5', 'Faster cooldowns', 'DASH'],
  [1, 0, 'Sprout', '+40', 'Grows with every task', 'GROW'],
  [2, 1, 'Twin', '×2', 'Double rewards · 15 min', 'DOUBLE'],
  [3, 4, 'Puff', '+3', 'Light as a cloud', 'FLOAT'],
  [4, 3, 'Echo', '+1', 'An old friend in the pack', 'CHIRP'],
];
const cardsReady = Promise.all([1, 2, 3, 4].map(addLayers)).then(() => {
  for (const c of CARDS) scene.set_showcase_card(...c);
});

// Pointer positions relative to the canvas: the page scrolls now.
const point = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
canvas.addEventListener('pointermove', (e) => scene.pointer_move(...point(e)));
canvas.addEventListener('pointerdown', (e) => { if (scene.pointer_down(...point(e))) canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => { if (scene.pointer_up(...point(e)) === 1) scene.open(); });
canvas.addEventListener('pointerleave', () => scene.leave());
// A vertical swipe can hand the gesture to the page mid-tear: treat that as a release.
canvas.addEventListener('pointercancel', (e) => { if (scene.pointer_up(...point(e)) === 1) scene.open(); });
// Enter opens the pack; Space is left to scroll the page.
canvas.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); scene.open(); } });
const hint = document.getElementById('hint'), again = document.getElementById('again');
again.onclick = () => { scene.reset(Math.floor(Math.random() * 1e9)); again.hidden = true; hint.textContent = T.tear; canvas.focus(); };

// One animation loop, paused while the tab is hidden or the pack is off screen.
let raf = 0, shown = false, heroOn = true;
function loop(t) {
  raf = 0;
  if (document.hidden || !heroOn) return;
  const ev = scene.frame(t);
  if (!shown) {
    shown = true;
    canvas.classList.add('on');
    document.getElementById('loading').classList.add('done');
  }
  if (ev & 4) {
    cardsReady.then(() => setTimeout(() => scene.showcase(), reduced ? 0 : 350));
    hint.textContent = T.ready;
    again.hidden = false;
  }
  raf = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) raf = requestAnimationFrame(loop); });
new IntersectionObserver(([e]) => { heroOn = e.isIntersecting; if (heroOn && !raf) raf = requestAnimationFrame(loop); }).observe(document.getElementById('top'));
loop(performance.now()); // draw the first frame now, then follow the display
canvas.focus({ preventScroll: true });

// For poking at it from the browser console.
window.playmand = { scene };
</script>

<script type="module">
// Screen 2: the harbor shot. Its code and art load only when the visitor
// scrolls near it, and it draws only while it is on screen.
const shot = document.getElementById('shot'), shotCanvas = document.getElementById('harbor');
const header = document.querySelector('header');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const load = (src) => new Promise((ok, bad) => { const img = new Image(); img.onload = () => ok(img); img.onerror = bad; img.src = src; });
let harbor = null, harborOn = false, hraf = 0, harborLoading = false;
// Resizing clears the canvas, so draw a frame straight away.
const fitHarbor = () => { if (!harbor) return; harbor.resize(shotCanvas.clientWidth, shotCanvas.clientHeight, devicePixelRatio || 1); harbor.frame(performance.now()); };
function hloop(t) {
  hraf = 0;
  if (!harbor || !harborOn || document.hidden) return;
  harbor.frame(t);
  shotCanvas.classList.add('on'); // over the poster only once a frame is drawn
  if (!reduced) hraf = requestAnimationFrame(hloop);
}
async function startHarbor() {
  harborLoading = true;
  const mod = await import('./pkg-harbor/harbor.js');
  await mod.default();
  const h = new mod.HarborScene(shotCanvas, false);
  const art = await Promise.all(['plate', 'mecha', 'masks'].map((n) => load(`art/harbor-${n}.webp`)));
  art.forEach((img, i) => h.set_image(i, img));
  h.set_reduced_motion(reduced);
  harbor = h;
  fitHarbor();
  if (harborOn && !hraf) hraf = requestAnimationFrame(hloop);
}
new IntersectionObserver(([e]) => { if (e.isIntersecting && !harborLoading) { shot.classList.add('near'); startHarbor(); } }, { rootMargin: '600px 0px' }).observe(shot);
new IntersectionObserver(([e]) => { harborOn = e.isIntersecting; if (harborOn && harbor && !hraf) hraf = requestAnimationFrame(hloop); }).observe(shot);
addEventListener('resize', fitHarbor);
document.addEventListener('visibilitychange', () => { if (!document.hidden && harborOn && harbor && !hraf) hraf = requestAnimationFrame(hloop); });
// The arrow scrolls to the shot. A plain #shot link would leave the Chinese
// page, whose <base href="../"> points it at the English one.
document.querySelector('.more').addEventListener('click', (e) => { e.preventDefault(); shot.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); });
// Light header text over the dark shot.
const headerTone = () => header.classList.toggle('dark', shot.getBoundingClientRect().top < 40);
addEventListener('scroll', headerTone, { passive: true }); headerTone();

window.playmandHarbor = () => harbor;
</script>
