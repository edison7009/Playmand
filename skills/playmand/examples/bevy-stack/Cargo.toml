[package]
name = "playmand-bevy-stack"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace]

[dependencies]
# Bevy's own `audio` feature is off: bevy_kira_audio replaces it.
bevy = { version = "=0.20.1", default-features = false, features = ["std", "bevy_asset"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "default-collider"] }
# With every feature off it does not compile (0.27.1 needs one format).
bevy_kira_audio = { version = "=0.27.1", default-features = false, features = ["ogg"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
