[package]
name = "playmand-promo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "Playmand promotional film, recorded frame by frame from a Bevy scene"

[dependencies]
bevy = "=0.20.1"

# Same dev profile as demos/: dependency code is optimized, our scene crate is not.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
