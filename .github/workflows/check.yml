name: Check skill, installer and Bevy examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/build_package.py

  bevy:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo +1.95.0 fmt --manifest-path skills/playmand/examples/ecs-patterns/Cargo.toml --check
      - run: cargo +1.95.0 test --locked --manifest-path skills/playmand/examples/ecs-patterns/Cargo.toml
