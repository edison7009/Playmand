name: Check skill, installer and Bevy examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: Python 3.9 is not published for ubuntu-latest (26.04).
        os: [windows-latest, ubuntu-24.04]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/build_package.py

  bevy:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: cargo +1.97.1 fmt --manifest-path skills/playmand/examples/ecs-patterns/Cargo.toml --check
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/ecs-patterns/Cargo.toml
      - run: cargo +1.97.1 fmt --manifest-path skills/playmand/examples/physics-avian/Cargo.toml --check
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/physics-avian/Cargo.toml
      - run: cargo +1.97.1 fmt --manifest-path skills/playmand/examples/feedback-tiers/Cargo.toml --check
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/feedback-tiers/Cargo.toml
      # The whole stack together. cpal (under bevy_kira_audio) needs ALSA headers on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo +1.97.1 fmt --manifest-path skills/playmand/examples/bevy-stack/Cargo.toml --check
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/bevy-stack/Cargo.toml
      # Bevy's own audio stays out, and every crate shares one egui and one kira.
      - shell: bash
        run: |
          cd skills/playmand/examples/bevy-stack
          if cargo +1.97.1 tree --locked -i bevy_audio >/dev/null 2>&1; then echo "bevy_audio is in the build"; exit 1; fi
          cargo +1.97.1 tree --locked -i egui --depth 0
          cargo +1.97.1 tree --locked -i kira --depth 0

  # Phase 2 pieces: audio, debug UI, a small 2D engine and the GPU API.
  pieces:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The GPU tests must really run in CI, not skip.
      PLAYMAND_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      # Linux runners have no GPU: lavapipe is a software Vulkan driver.
      # Windows has the WARP software adapter built in.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Format
        shell: bash
        run: for e in audio-kira ui-egui macroquad-2d gpu-wgpu; do cargo +1.97.1 fmt --manifest-path skills/playmand/examples/$e/Cargo.toml --check; done
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/audio-kira/Cargo.toml
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/ui-egui/Cargo.toml
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/macroquad-2d/Cargo.toml --lib
      - run: cargo +1.97.1 build --locked --release --target wasm32-unknown-unknown --manifest-path skills/playmand/examples/macroquad-2d/Cargo.toml
      - run: cargo +1.97.1 test --locked --manifest-path skills/playmand/examples/gpu-wgpu/Cargo.toml

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.93.0 fmt --manifest-path web/Cargo.toml --check
      - run: cargo +1.93.0 test --locked --manifest-path web/Cargo.toml
      - run: cargo +1.93.0 clippy --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo +1.93.0 test --locked --manifest-path web/Cargo.toml --features pets
      - run: cargo +1.93.0 clippy --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown --features pets -- -D warnings
